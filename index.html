<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>BUL Run</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first jump-and-run in the case deck's look — Michelin navy, yellow diagonals, Bibendum as runner and narrator. Play screen: score strip, course progress, canvas stage, big jump pad. Quiz cards slide over the stage. #host = projector page. Single light look by choice (matches the slides). */
:root{
  --page:#EEF3FB;      /* soft blue-white ground */
  --card:#FFFFFF;
  --navy:#0E2A6E;      /* Michelin deep blue */
  --blue:#2350B4;      /* secondary blue */
  --sky:#DCE7FA;       /* tints */
  --ink:#13224A;       /* text */
  --muted:#5B6B92;
  --yellow:#FCE300;    /* Michelin yellow */
  --good:#16A55B; --bad:#E5484D;
  --display:"Prompt","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai","Prompt",system-ui,sans-serif;
  --shadow:0 10px 28px rgba(14,42,110,.12);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
body.playing{overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.wrap{max-width:560px;margin:0 auto;padding-block:14px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.host .wrap{max-width:1320px}
p{margin:0}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2;text-wrap:balance}
h1{font-weight:800;font-size:clamp(2rem,7vw,3.2rem);letter-spacing:-.01em}
h2{font-weight:700;font-size:1.35rem;color:var(--navy)}
h3{font-weight:600;font-size:1rem;color:var(--navy)}
.eyebrow{display:block;font-family:var(--display);font-weight:600;letter-spacing:.24em;text-transform:uppercase;font-size:.72rem}
.muted{color:var(--muted)}
.hl{background:linear-gradient(transparent 58%,var(--yellow) 58%);padding:0 .1em}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
button{font:inherit;color:var(--ink);cursor:pointer;border-radius:14px;border:2px solid var(--sky);background:var(--card);padding:12px 16px;transition:transform .12s,border-color .12s,background .12s;touch-action:manipulation}
button:hover{border-color:var(--blue)}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.btn{background:var(--navy);color:#fff;border-color:var(--navy);font-family:var(--display);font-weight:600;font-size:1.1rem;padding:14px 18px;display:flex;justify-content:center;align-items:center;gap:10px}
.btn:hover{background:var(--blue);border-color:var(--blue)}
.btn .arrow{color:var(--yellow);font-size:1.3rem;line-height:1}
input{font:inherit;color:var(--ink);background:var(--page);border:2px solid var(--sky);border-radius:14px;padding:12px 14px;width:100%;min-width:0}

/* hero (navy band with road photo, like the title slide) */
.hero{position:relative;overflow:hidden;border-radius:24px;background:var(--navy);color:#fff;min-height:270px;padding:22px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:0;background:var(--road) right center/cover no-repeat;opacity:.55}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,var(--navy) 30%,rgba(14,42,110,.35) 75%,rgba(14,42,110,0));}
.hero>*{position:relative;z-index:1}
.hero .eyebrow{color:var(--yellow)}
.hero h1 em{font-style:normal;color:var(--yellow)}
.hero .tagline{font-family:var(--display);letter-spacing:.3em;font-size:.7rem;text-transform:uppercase;opacity:.85}
.slash{position:absolute;z-index:1;top:-20px;right:120px;width:14px;height:140%;background:var(--yellow);transform:rotate(24deg);opacity:.95}
.hero .mascot{position:absolute;z-index:2;right:-6px;top:14px;width:150px;height:150px;border-radius:50%;object-fit:cover;border:5px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.25)}

/* mascot speech */
.say{display:flex;gap:12px;align-items:flex-end}
.say img{flex:none;width:78px;height:78px;border-radius:50%;object-fit:cover;border:3px solid var(--card);box-shadow:var(--shadow);background:#fff}
.bubble{position:relative;background:var(--card);border-radius:18px 18px 18px 4px;padding:12px 16px;box-shadow:var(--shadow);min-width:0}
.bubble b{display:block;font-family:var(--display);color:var(--blue);font-size:.8rem;letter-spacing:.06em}
.bubble.good{background:#E9F8F0} .bubble.warn{background:#FFF7CC} .bubble.bad{background:#FDE3E3}

/* intro how-to */
.howto{display:flex;flex-direction:column;gap:10px}
.howto div{display:flex;gap:12px;align-items:center;background:var(--page);border-radius:14px;padding:10px 12px;font-size:.98rem;line-height:1.4}
.howto .em{flex:none;font-size:1.6rem;width:36px;text-align:center}
.sound{display:flex;align-items:center;gap:10px;background:var(--yellow);color:var(--navy);border-radius:14px;padding:10px 14px;font-weight:600}
.iconbtn{padding:6px 10px;border-radius:99px;font-size:1rem;line-height:1}

/* play screen */
.play{position:relative;height:100vh;height:100dvh;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding:max(8px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;gap:6px}
.pill{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:99px;padding:4px 10px;font-size:.95rem;box-shadow:var(--shadow);font-family:var(--display);font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.score{background:var(--navy);color:var(--yellow);font-size:1.1rem;min-width:56px;justify-content:center}
.pill.time{background:var(--yellow);color:var(--navy);min-width:72px;justify-content:center}
.pill.time.late{background:var(--bad);color:#fff}
.top .sp{flex:1}
.course{position:relative;height:12px;margin:4px 6px;background:var(--card);border-radius:99px;box-shadow:inset 0 0 0 2px var(--sky)}
.course .run{position:absolute;inset:0 auto 0 0;background:var(--blue);border-radius:99px}
.course .q{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:5px;background:var(--yellow);color:var(--navy);font:700 .7rem/18px var(--display);text-align:center;box-shadow:0 0 0 2px var(--navy)}
.course .q.done{background:var(--good);color:#fff;box-shadow:0 0 0 2px var(--good)}
.course .fin{position:absolute;right:-10px;top:-9px;font-size:1.1rem;line-height:1}
.stage{position:relative;flex:none;width:100%;aspect-ratio:1/1;max-height:calc(100dvh - 230px);border-radius:20px;overflow:hidden;box-shadow:0 0 0 3px var(--navy),0 0 0 6px var(--yellow),var(--shadow);margin:4px 0;background:#9CC3F5;touch-action:none}
.stage canvas{display:block;width:100%;height:100%}
.next{margin-top:auto;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:10px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.next::after{content:"";position:absolute;right:26px;top:-20px;width:10px;height:120px;background:var(--yellow);transform:rotate(24deg)}
.next img{flex:none;width:52px;height:52px;border-radius:50%;object-fit:cover;border:3px solid var(--yellow);background:#fff}
.next b{display:block;font-family:var(--display);color:var(--navy);font-size:1.05rem;line-height:1.3}
.next span{display:block;font-size:.8rem;color:var(--muted);line-height:1.3}
@media (max-height:700px){.next{display:none}}
.pad{flex:1 1 88px;min-height:88px;max-height:240px;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:20px;border:0;background:var(--yellow);color:var(--navy);font-family:var(--display);font-weight:800;font-size:1.5rem;box-shadow:0 6px 0 #C9B400,var(--shadow);touch-action:none}
.pad small{font-family:var(--body);font-weight:500;font-size:.8rem;opacity:.8}
.pad.down{transform:translateY(4px);box-shadow:0 2px 0 #C9B400,var(--shadow)}
.float{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-family:var(--display);font-weight:800;font-size:1.3rem;color:#fff;text-shadow:0 2px 0 var(--navy),0 0 12px rgba(14,42,110,.6);pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .2s}
.float.show{opacity:1}

/* quiz sheet over the stage */
.quiz{position:fixed;inset:0;z-index:15;background:rgba(14,42,110,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.quiz .sheet{width:100%;max-width:560px;max-height:100%;overflow:auto;background:var(--card);border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,.35);display:flex;flex-direction:column;animation:up .3s ease-out}
.quiz .qh{position:relative;overflow:hidden;background:var(--navy);color:#fff;padding:16px 18px;display:flex;gap:12px;align-items:center}
.quiz .qh::after{content:"";position:absolute;right:30px;top:-30px;width:12px;height:140px;background:var(--yellow);transform:rotate(24deg)}
.quiz .qh>*{position:relative;z-index:1}
.quiz .qbox{flex:none;width:48px;height:48px;border-radius:10px;background:var(--yellow);color:var(--navy);display:grid;place-items:center;font:800 1.6rem var(--display);box-shadow:inset 0 -4px 0 #C9B400}
.quiz .qh b{display:block;font-family:var(--display);color:var(--yellow);font-size:.8rem;letter-spacing:.12em}
.quiz .qh h2{color:#fff;font-size:1.15rem}
.quiz .qb{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;font-size:1rem;line-height:1.4;min-height:56px}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;background:var(--sky);color:var(--navy);display:grid;place-items:center;font-family:var(--display);font-weight:700}
.opt.right{border-color:var(--good);background:#E9F8F0}.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:#FDE3E3}.opt.wrong .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default;transform:none;color:var(--ink)}
.say.small img{width:58px;height:58px}
.say.small .bubble{font-size:.95rem;line-height:1.45}

.overlay{position:fixed;inset:0;z-index:20;background:rgba(14,42,110,.9);color:#fff;display:grid;place-items:center;text-align:center;padding:24px}
.overlay .box{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:340px}
.overlay .num{font-family:var(--display);font-size:7rem;line-height:1;font-weight:800;color:var(--yellow)}
.overlay img{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid #fff;background:#fff}

/* ending */
.end-hero{align-items:center;text-align:center;min-height:0;padding-top:26px}
.end-hero .slash{right:-30px;top:-40px;height:60%}
.end-hero::after{background:linear-gradient(180deg,rgba(14,42,110,.55),var(--navy) 70%)}
.end-hero .big{width:150px;height:150px;border-radius:50%;object-fit:cover;border:5px solid #fff;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.stars{display:flex;gap:8px;justify-content:center}
.stars svg{width:44px;height:44px}
.stars .on{fill:var(--yellow)} .stars .off{fill:rgba(255,255,255,.18)}
.score{font-family:var(--display);font-size:3.6rem;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;color:var(--yellow)}
.ticket{position:relative;background:var(--card);border:2px dashed var(--navy);border-radius:16px;padding:14px 18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center;gap:6px}
.ticket span{display:block;font-size:.72rem;color:var(--muted);letter-spacing:.08em}
.ticket b{font-family:var(--display);font-size:1.2rem;color:var(--navy);overflow-wrap:anywhere}
.ticket .code b{letter-spacing:.18em;background:var(--yellow);border-radius:8px;padding:0 6px}
.sum{display:flex;flex-direction:column;gap:6px}
.sum div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--sky);padding-bottom:6px;font-variant-numeric:tabular-nums}
.sum div:last-child{border:0;font-family:var(--display);font-weight:700;color:var(--navy)}
.review{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.review li{display:flex;gap:10px;align-items:flex-start;background:var(--page);border-radius:12px;padding:10px 12px;line-height:1.4;font-size:.95rem}
.review .mk{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.review .mk.ok{background:var(--good)} .review .mk.no{background:var(--bad)}
.review small{display:block;color:var(--muted)}

/* host */
.host-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.brandline{display:flex;align-items:center;gap:12px}
.brandline img{width:58px;height:58px;border-radius:50%;object-fit:cover;border:3px solid var(--card);box-shadow:var(--shadow)}
.brandline .eyebrow{color:var(--blue)}
.brandline h1{font-size:clamp(1.6rem,3vw,2.3rem);color:var(--navy)}
.brandline h1 em{font-style:normal;background:linear-gradient(transparent 60%,var(--yellow) 60%)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;background:var(--card);border-radius:99px;padding:5px;box-shadow:var(--shadow)}
.tabs button{border:0;border-radius:99px;padding:8px 16px;font-family:var(--display);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--navy);color:#fff}
.join{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px}
.join .hero{min-height:420px;justify-content:center;padding:36px}
.join .hero h1{font-size:clamp(2.2rem,4.4vw,3.6rem)}
.join .hero .mascot{width:210px;height:210px;top:auto;bottom:24px;right:24px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;font-size:1.12rem;max-width:30ch}
.steps li{display:flex;gap:12px;align-items:flex-start}
.steps li span{flex:none;width:30px;height:30px;border-radius:50%;background:var(--yellow);color:var(--navy);display:grid;place-items:center;font-family:var(--display);font-weight:700}
.qrcard{align-items:center;text-align:center;justify-content:center}
#qr{background:#fff;padding:12px;border-radius:16px;border:3px solid var(--navy)}
#qr img,#qr canvas{display:block;width:min(330px,68vw);height:auto}
.url{font-family:var(--display);word-break:break-all;color:var(--blue);font-weight:500}
.urlrow{display:flex;gap:8px}
.urlrow button{white-space:nowrap}
.entry{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr)) auto;gap:8px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--sky)}
th{color:var(--muted);font-weight:500;font-size:.9rem}
.tw{overflow-x:auto}
.ok{color:var(--good);font-weight:600} .bad{color:var(--bad);font-weight:600}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:14px;align-items:end;text-align:center}
.podium .p{border-radius:18px 18px 8px 8px;padding:18px 10px;display:flex;flex-direction:column;gap:4px;align-items:center;min-width:0;background:var(--sky);color:var(--navy)}
.podium .p.first{background:var(--navy);color:#fff;padding-block:22px 34px}
.podium .p.first img{width:110px;height:110px;border-radius:50%;object-fit:cover;border:4px solid var(--yellow);background:#fff;margin-top:-70px}
.podium .rank{font-family:var(--display);font-size:2.6rem;line-height:1;font-weight:800}
.podium .first .rank{color:var(--yellow)}
.podium .nm{font-family:var(--display);font-size:1.5rem;font-weight:700;overflow-wrap:anywhere}
.podium .sc{font-variant-numeric:tabular-nums}
.livehead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.count{display:inline-block;background:var(--yellow);color:var(--navy);border-radius:99px;padding:0 12px;font-size:1rem;vertical-align:middle}
tr.top td{background:#FFFBD6}
td b{font-family:var(--display);color:var(--navy)}
.debrief{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.debrief .num{width:40px;height:40px;border-radius:50%;background:var(--yellow);color:var(--navy);display:grid;place-items:center;font-family:var(--display);font-weight:800}
@media (max-width:900px){.join,.debrief{grid-template-columns:1fr}.entry{grid-template-columns:1fr 1fr}.podium{grid-template-columns:1fr}.podium .first{order:-1}}
@media (max-width:380px){.hero .mascot{width:110px;height:110px}}
@media (max-height:640px){.pad{min-height:70px}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.pop{animation:pop .35s ease-out}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="st" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></symbol>
</svg>
<div id="app"></div>

const AU={ctx:null,on:load("bul-sound",true),lvl:1,step:0,loop:0,next:0,timer:0};
const hz=m=>440*2**((m-69)/12);
AU.bpm=()=>[96,138][AU.lvl];
function auInit(){
  if(AU.ctx){if(AU.ctx.state==="suspended")AU.ctx.resume();return}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  const c=AU.ctx=new C();
  AU.out=c.createGain();AU.out.gain.value=AU.on?1:0;AU.out.connect(c.destination);
  AU.mus=c.createGain();AU.mus.gain.value=.3;AU.mus.connect(AU.out);
  AU.fx=c.createGain();AU.fx.gain.value=.55;AU.fx.connect(AU.out);
  const b=c.createBuffer(1,c.sampleRate*.5,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  AU.noise=b;
}
function tone(dest,type,f,t,dur,vol,f2){
  const c=AU.ctx,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.05);
}
function hiss(dest,t,dur,vol,hp){
  const c=AU.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=AU.noise;f.type="highpass";f.frequency.value=hp;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(dest);s.start(t,Math.random()*.4);s.stop(t+dur+.02);
}
// bouncy 8-bit platformer tune in C; lvl 0 = calm quiz loop, lvl 1 = running
const PROG=[[48,[60,64,67]],[53,[60,65,69]],[55,[59,62,67]],[48,[60,64,67]]];
const LEAD=[76,0,76,0,72,76,0,79, 0,0,77,0,74,77,81,0, 79,0,77,74,0,71,74,0, 72,0,76,79,84,0,0,0];
function beat(s,t){
  const i=s%16,[root,ch]=PROG[Math.floor(s/16)%4],sp=60/AU.bpm()/4,M=AU.mus;
  if(AU.lvl){
    if(i%4===0)tone(M,"sine",140,t,.14,.7,45);
    if(i%4===2)hiss(M,t,.05,.25,7000);
    if(i===4||i===12)hiss(M,t,.1,.22,2000);
    if(i%2===0)tone(M,"square",hz(root+(i%4===2?12:0)),t,sp*1.4,.06);
    if(i%2===0){const n=LEAD[(s>>1)%32];if(n)tone(M,"square",hz(n),t,sp*1.6,.055)}
  }else{
    if(i%4===0)tone(M,"triangle",hz(root),t,sp*3.5,.35);
    if(i%2===0)tone(M,"sine",hz(ch[(i>>1)%3]+12),t,sp*1.8,.12);
  }
}
function musicStart(lvl){
  auInit();if(!AU.ctx)return;AU.lvl=lvl;if(AU.timer)return;
  AU.step=0;AU.loop=0;AU.next=AU.ctx.currentTime+.08;
  AU.timer=setInterval(()=>{
    const c=AU.ctx;if(c.state!=="running")return;
    if(AU.next<c.currentTime)AU.next=c.currentTime+.02;
    while(AU.next<c.currentTime+.15){beat(AU.step,AU.next);AU.next+=60/AU.bpm()/4;if(++AU.step%64===0)AU.loop++}
  },25);
}
function musicStop(){clearInterval(AU.timer);AU.timer=0}
function sfx(n){
  if(!AU.ctx||AU.ctx.state!=="running")return;
  const t=AU.ctx.currentTime+.01,F=AU.fx;
  const seq=(notes,gap,type,dur,vol)=>notes.forEach((m,k)=>tone(F,type,hz(m),t+k*gap,dur,vol));
  switch(n){
    case"jump":tone(F,"square",330,t,.16,.12,780);break;
    case"jump2":tone(F,"square",500,t,.14,.1,1100);break;
    case"coin":seq([88,95],.06,"square",.12,.1);break;
    case"bump":tone(F,"sawtooth",200,t,.3,.3,60);hiss(F,t,.2,.25,800);break;
    case"fall":tone(F,"square",700,t,.6,.14,90);break;
    case"quiz":seq([72,79,84,79,84],.07,"square",.12,.12);break;
    case"right":seq([72,76,79,84],.08,"triangle",.18,.4);break;
    case"wrong":seq([64,60],.14,"square",.2,.14);break;
    case"tick":tone(F,"square",1320,t,.05,.12);break;
    case"go":seq([72,76,79,84],.09,"square",.16,.16);break;
    case"end":seq([72,76,79,84,79,84,88,91],.12,"triangle",.26,.35);break;
  }
}
function setSound(on){
  AU.on=on;store("bul-sound",on);
  if(AU.ctx)AU.out.gain.setTargetAtTime(on?1:0,AU.ctx.currentTime,.03);
  document.querySelectorAll("[data-sound]").forEach(b=>{b.textContent=on?"🔊":"🔇";b.setAttribute("aria-label",on?"ปิดเสียง":"เปิดเสียง")});
}
function bindSound(){document.querySelectorAll("[data-sound]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();auInit();setSound(!AU.on)});setSound(AU.on)}

const H=360,GROUND=300,SPEED=215,SEC=1500,START=500,PW=30,PH=44;
const PTS={coin:10,quiz:200,bump:-50,fall:-100};
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// same course for everyone so ranking is fair
function buildLevel(){
  const R=rng(1011),L={ground:[],plats:[],obs:[],coins:[],boxes:[],finish:START+6*SEC};
  let g0=0;
  const coinArc=(x,y,n,gap)=>{for(let k=0;k<n;k++){const u=n>1?k/(n-1):.5;L.coins.push({x:x+k*gap,y:y-Math.sin(u*Math.PI)*60})}};
  for(let s=0;s<6;s++){
    const end=START+(s+1)*SEC;let x=START+s*SEC+(s?200:0);
    while(x<end-520){
      const r=R(),hard=s>=3;

    [[fx+4,"#FCE300"],[fx+154,"#E5484D"]].forEach(([px,c])=>{CX.fillStyle=c;CX.beginPath();CX.moveTo(px,GROUND-230);CX.quadraticCurveTo(px+16,GROUND-232+wave,px+30,GROUND-222);CX.lineTo(px,GROUND-212);CX.fill();CX.fillStyle="#13224A";CX.fillRect(px-1,GROUND-232,3,50)});
  }
  drawRunner(p.x,p.y,t,p);
  // particles & score pops
  for(const f of G.fx){
    const a=Math.max(0,f.life/f.max);
    if(f.text!=null){CX.globalAlpha=a;CX.font="800 15px Prompt, sans-serif";CX.lineWidth=3;CX.strokeStyle="#0E2A6E";CX.strokeText(f.text,f.x,f.y);CX.fillStyle=f.col;CX.fillText(f.text,f.x,f.y);continue}
    CX.globalAlpha=a;CX.fillStyle=f.col;
    if(f.sq){CX.save();CX.translate(f.x,f.y);CX.rotate(f.life*8);CX.fillRect(-f.r,-f.r/2,f.r*2,f.r);CX.restore()}
    else{CX.beginPath();CX.arc(f.x,f.y,f.r*(f.g?1:.6+a*.6),0,7);CX.fill()}
  }
  CX.globalAlpha=1;
  CX.restore();
  // gentle vignette frames the scene
  const vg=CX.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*.95);vg.addColorStop(0,"rgba(14,42,110,0)");vg.addColorStop(1,"rgba(14,42,110,.28)");
  CX.fillStyle=vg;CX.fillRect(0,0,W,H);
}
function hud(){

function step(dt){
  // small fixed steps keep jumps the same on slow and fast phones
  let left=dt;while(left>0&&(G.state==="run"||G.state==="goal")){const s=Math.min(left,1/120);update(s);left-=s}
}
function loop(ts){
  if(!G||!G.live)return;
  const raw=Math.max(0,(ts-LAST)/1000),dt=Math.min(.05,raw);LAST=ts;
  if(!G.paused){
    // real time counts while running and while a quiz is open; it stops at the finish line
    if(G.state==="run"||G.state==="quiz")G.clock+=raw;
    if(G.state==="run"||G.state==="goal"){step(dt);draw()}
    hud();
    if(G.state==="end"){G.live=false;return finish()}
  }
  RAF=requestAnimationFrame(loop);
}

function submitScore(rec){
  const el=$("#sendState");if(!el)return;

    .then(()=>{el.innerHTML=`<span class="ok">✓ ส่งคะแนนขึ้นจอหน้าห้องแล้ว</span>`})

function liveRank(H,save,head,bindTabs){
  $("#app").innerHTML=`<div class="wrap">${head}<div id="board" style="display:flex;flex-direction:column;gap:16px"></div></div>`;
  bindTabs();
  let live=null,err="",lastKey="";
  const draw=force=>{
    const list=(live||[]).filter(r=>r.t>=(H.since||0)&&proof(String(r.name),Number(r.score),Number(r.icare))===String(r.code).toUpperCase());
    // each person counts once: their best game
    const best={};
    list.forEach(r=>{const k=String(r.name).trim().toLowerCase(),b=best[k];if(!b||r.score>b.score||(r.score===b.score&&r.icare>b.icare))best[k]=r});
    const ranked=Object.values(best).sort((a,b)=>b.score-a.score||b.icare-a.icare||a.t-b.t);
    const key=JSON.stringify(ranked)+err+(live?1:0);
    if(!force&&key===lastKey)return;lastKey=key;
    $("#board").innerHTML=`${podiumHTML(ranked)}
      <div class="card"><div class="livehead"><h2>อันดับสด <span class="count">${ranked.length} คน</span></h2>
        <span class="${err?"bad":"muted"}">${err||(live?"อัปเดตอัตโนมัติทุก 5 วินาที":"กำลังโหลดคะแนน…")}</span></div>
        ${ranked.length?`<div class="tw"><table><thead><tr><th>อันดับ</th><th>ชื่อ</th><th>คะแนน</th><th>ดาว</th><th>ตอบถูก</th></tr></thead><tbody>
          ${ranked.map((r,i)=>`<tr class="${i<3?"top":""}"><td><b>${i+1}</b></td><td>${esc(r.name)}</td><td><b>${r.score}</b></td><td>${"★".repeat(r.stars||0)||"–"}</td><td>${r.icare}/5</td></tr>`).join("")}
        </tbody></table></div>`:`<p class="muted">ยังไม่มีใครเล่นจบ คะแนนจะขึ้นที่นี่ทันทีที่มีคนเล่นจบ</p>`}
        <div><button type="button" id="newRound">เริ่มรอบใหม่ (ซ่อนคะแนนก่อนหน้านี้)</button> <span id="nrAsk"></span>
        ${H.since?` <button type="button" id="showAll">แสดงคะแนนทั้งหมด</button>`:""}</div></div>`;
    $("#newRound").onclick=()=>{$("#nrAsk").innerHTML=`ยืนยัน? <button type="button" class="btn" id="nrYes" style="display:inline-flex">เริ่มรอบใหม่</button>`;$("#nrYes").onclick=()=>{H.since=Date.now();save();draw(true)}};
    if($("#showAll"))$("#showAll").onclick=()=>{H.since=0;save();draw(true)};
  };
  const pull=()=>fetch(SCRIPT_URL+(SCRIPT_URL.includes("?")?"&":"?")+"t="+Date.now()).then(r=>r.json())
    .then(d=>{live=Array.isArray(d)?d:[];err="";draw()})
    .catch(()=>{err="เชื่อมต่อกระดานคะแนนไม่ได้ กำลังลองใหม่…";draw()});
  draw(true);pull();POLL=setInterval(pull,5000);
}

      ${podiumHTML(ranked)}
      <div class="card"><h2>หาผู้ชนะใน 1 นาที</h2>
        <p class="muted">ให้ทุกคนที่เล่นจบยืนขึ้น แล้วไล่เรียก “ใครตอบถูกไม่ครบ 5 ข้อ นั่งลง” → “ต่ำกว่า 1,600 นั่งลง” → 1,800 → 1,900 → … จนเหลือไม่กี่คน จากนั้นกรอกข้อมูลจากหน้าจอมือถือของคนที่ยังยืนอยู่ ระบบจะตรวจรหัสและจัดอันดับให้</p>
        <form class="entry" id="addForm">
          <input id="fn" placeholder="ชื่อ" required aria-label="ชื่อ"><input id="fs" type="number" min="0" max="3000" placeholder="คะแนน" required aria-label="คะแนน">
          <input id="fi" type="number" min="0" max="5" placeholder="ตอบถูก" required aria-label="จำนวนข้อที่ตอบถูก"><input id="fc" maxlength="4" placeholder="รหัส" required aria-label="รหัส">
          <button type="submit" class="btn">เพิ่ม</button></form>
        ${rows.length?`<div class="tw"><table><thead><tr><th>ชื่อ</th><th>คะแนน</th><th>ตอบถูก</th><th>รหัส</th><th>ตรวจสอบ</th><th></th></tr></thead><tbody>
          ${rows.map((r,i)=>`<tr><td>${esc(r.name)}</td><td>${r.score}</td><td>${r.icare}/5</td><td>${esc(r.code)}</td><td class="${r.valid?"ok":"bad"}">${r.valid?"✓ ถูกต้อง":"✗ รหัสไม่ตรง"}</td><td><button type="button" data-del="${i}">ลบ</button></td></tr>`).join("")}
          </tbody></table></div>`:""}
        ${rows.length?`<div><button type="button" id="clear">ล้างรายชื่อทั้งหมด</button> <span id="clearAsk"></span></div>`:""}
      </div></div>`;
    $("#addForm").onsubmit=ev=>{ev.preventDefault();H.rows.push({name:$("#fn").value.trim(),score:+$("#fs").value,icare:+$("#fi").value,code:$("#fc").value.trim().toUpperCase()});save();go();setTimeout(()=>$("#fn")&&$("#fn").focus(),0)};
    document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{H.rows.splice(+b.dataset.del,1);save();go()});
    if($("#clear"))$("#clear").onclick=()=>{$("#clearAsk").innerHTML=`ยืนยัน? <button type="button" class="btn" id="yes" style="display:inline-flex">ล้างเลย</button>`;$("#yes").onclick=()=>{H.rows=[];save();go()}};
    bindTabs();return;
  }
  if(H.tab==="talk"){
    $("#app").innerHTML=`<div class="wrap">${head}<div class="debrief">${TALK()}</div></div>`;bindTabs();return;
  }
  $("#app").innerHTML=`<div class="wrap">${head}
    <div class="join">
      <section class="hero"><i class="slash" aria-hidden="true"></i><img class="mascot" src="${IMG.thumbs}" alt="Michelin Man ชูนิ้วโป้ง">
        <span class="eyebrow">เล่นคนเดียวบนมือถือ · 1–2 นาที · เปิดเสียงด้วย</span>
        <h1>สแกน<br>แล้ววิ่ง<br><em>สู่เส้นชัย</em></h1>
        <ol class="steps">${["แตะจอเพื่อกระโดด ตัวละครวิ่งเอง","เก็บยาง หลบกรวยและหลุม","ตอบควิซ ICARE 5 ข้อระหว่างทาง","จับเวลา ยิ่งเร็วยิ่งได้โบนัส ลุ้นอันดับ 1–3"].map((s,i)=>`<li><span>${i+1}</span>${s}</li>`).join("")}</ol></section>
      <div class="card qrcard"><div id="qr" role="img" aria-label="QR code สำหรับเข้าเกม"></div>
        <h2>สแกนเพื่อเริ่มเล่น</h2><p class="url">${esc(PLAY_URL)}</p></div>
    </div>
    <form class="card" id="urlForm"><label for="urlIn"><h3>ลิงก์ที่ QR พาไป</h3></label>
      <p class="muted">ถ้านำไฟล์ HTML ไปวางบนเว็บอื่น ระบบจะใช้ลิงก์ของเว็บนั้นให้เอง ถ้า QR ยังไม่ถูก ใส่ลิงก์ใหม่ตรงนี้</p>
      <div class="urlrow"><input id="urlIn" type="url" value="${esc(PLAY_URL)}"><button type="submit">อัปเดต QR</button><button type="button" id="urlReset">ค่าเริ่มต้น</button></div></form></div>`;
  $("#urlForm").onsubmit=ev=>{ev.preventDefault();H.url=$("#urlIn").value.trim();save();go()};
  $("#urlReset").onclick=()=>{H.url="";save();go()};
  bindTabs();
  const el=$("#qr");
  if(window.QRCode)new QRCode(el,{text:PLAY_URL,width:512,height:512,colorDark:"#0E2A6E",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
  else el.innerHTML=`<p style="padding:20px">โหลด QR ไม่ได้ ใช้ลิงก์ด้านล่างแทน</p>`;
  function bindTabs(){document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{H.tab=b.dataset.tab;save();go()})}
}
function TALK(){return [
  ["ยกมือ: ใครตอบถูกครบ 5 ข้อ?","ถามคนที่พลาดว่าข้อไหนยากที่สุด แล้วเฉลยร่วมกัน ส่วนใหญ่มักพลาดเรื่อง SVP หรือ Leader Substitute"],
  ["ICARE ตัวไหนที่ใช้ยากที่สุดในที่ทำงานจริง?","ชวนเล่าประสบการณ์: การให้อำนาจ (Empowerment) และการสร้างความไว้ใจ (Create Trust) มักยากที่สุด เพราะหัวหน้ากลัวเสียการควบคุม"],
  ["ถ้าคุณเป็นหัวหน้า จะกล้า “กลับบ้านก่อน 6 โมง” แบบ Dussoyer ไหม?","ความไว้วางใจต้องเริ่มจากผู้นำปล่อยมือก่อน ทีมจึงกลายเป็น Leader Substitute ได้"]
 ].map(([q,a],i)=>`<div class="card"><div class="num">${i+1}</div><h2>${esc(q)}</h2><p class="muted">${esc(a)}</p></div>`).join("")}

location.hash==="#host"?host():intro();
window.addEventListener("hashchange",()=>location.reload());
</script>

</body></html>
